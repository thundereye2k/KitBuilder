<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1013">
  <title>KitBuilder — Weapon Kit Configurator</title>
  <meta name="description" content="Configure rifles, SMGs and pistols with optics, stocks, handguards, grips, lights and lasers.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark">▞</span> KIT<b>BUILDER</b></div>
    <nav id="categories" class="tabs" aria-label="Weapon categories"></nav>
    <div class="actions">
      <button id="btn-reset" class="btn ghost">Reset</button>
      <button id="btn-share" class="btn">Copy link</button>
      <button id="btn-export" class="btn ghost">Export</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel weapons">
      <h2>Weapon</h2>
      <ul id="weapon-list" class="weapon-list"></ul>
    </aside>

    <section class="stage-wrap">
      <div class="stage-head">
        <div>
          <h1 id="weapon-name">—</h1>
          <p id="weapon-meta" class="muted"></p>
        </div>
        <div class="actions"><button id="btn-view" class="btn ghost">Reset view</button><button id="btn-labels" class="btn ghost" aria-pressed="false">Slot labels</button></div>
      </div>
      <div class="stage"><div id="viewport" class="viewport"></div><div id="labels" class="labels"></div>
        <div class="view-tools">
          <button id="tool-parts" class="tool-wide" title="Parts" aria-label="Parts" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Parts</span></button>
          <button id="tool-reset" title="Reset view" aria-label="Reset view"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
          <button id="tool-labels" title="Slot labels" aria-label="Slot labels" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12 12 20 4 12V4h8z"/><circle cx="8.5" cy="8.5" r="1.2"/></svg></button>
          <button id="btn-full" title="Fullscreen" aria-label="Fullscreen" aria-pressed="false"><svg class="i-enter" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><svg class="i-exit" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
        </div>
        <div class="hint"><span class="h-d">Drag to rotate · right-drag to move · scroll to zoom · click a part</span><span class="h-t">1 finger rotate · 2 fingers move &amp; zoom · tap a part</span></div></div>

      <div id="stats" class="stats"></div>
      <div id="build-list" class="build-list"></div>
    </section>

    <aside class="panel parts">
      <h2 id="parts-title">Select a slot</h2>
      <div id="slot-tabs" class="slot-tabs"></div>
      <div id="rail-ctl" class="rail" hidden>
        <div class="rail-head"><span>Position on rail</span><output id="rail-val">Default</output></div>
        <div class="rail-row">
          <button id="rail-back" class="rail-btn" aria-label="Move towards the stock">◀</button>
          <div class="rail-track"><div id="rail-blocked" class="rail-blocked"></div><input id="rail-range" type="range" step="1" aria-label="Position along the rail"></div>
          <button id="rail-fwd" class="rail-btn" aria-label="Move towards the muzzle">▶</button>
        </div>
        <div class="rail-ends"><span>Stock</span><button id="rail-center" class="link">Reset position</button><span>Muzzle</span></div>
        <p id="rail-note" class="rail-note"></p>
      </div>
      <ul id="part-list" class="part-list"></ul>
    </aside>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script type="importmap">
  { "imports": { "three": "./js/vendor/three.module.min.js", "three/addons/": "./js/vendor/addons/" } }
  </script>
  <script src="data/data.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
