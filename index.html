<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1013">
  <title>KitBuilder — Weapon Kit Configurator</title>
  <meta name="description" content="Configure rifles, SMGs and pistols with optics, stocks, handguards, grips, lights and lasers.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark">▞</span> KIT<b>BUILDER</b></div>
    <nav id="categories" class="tabs" aria-label="Weapon categories"></nav>
    <div class="actions">
      <button id="btn-reset" class="btn ghost">Reset</button>
      <button id="btn-share" class="btn">Copy link</button>
      <button id="btn-export" class="btn ghost">Export</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel weapons">
      <h2>Weapon</h2>
      <ul id="weapon-list" class="weapon-list"></ul>
    </aside>

    <section class="stage-wrap">
      <div class="stage-head">
        <div>
          <h1 id="weapon-name">—</h1>
          <p id="weapon-meta" class="muted"></p>
        </div>
        <div class="actions"><button id="btn-view" class="btn ghost">Reset view</button><button id="btn-labels" class="btn ghost" aria-pressed="false">Slot labels</button></div>
      </div>
      <div class="stage"><div id="viewport" class="viewport"></div><div id="labels" class="labels"></div>
        <div class="hint"><span class="h-d">Drag to rotate · scroll to zoom · click a part or slot</span><span class="h-t">Drag to rotate · pinch to zoom · tap a slot</span></div></div>

      <div id="stats" class="stats"></div>
      <div id="build-list" class="build-list"></div>
    </section>

    <aside class="panel parts">
      <h2 id="parts-title">Select a slot</h2>
      <div id="slot-tabs" class="slot-tabs"></div>
      <ul id="part-list" class="part-list"></ul>
    </aside>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script type="importmap">
  { "imports": { "three": "./js/vendor/three.module.min.js", "three/addons/": "./js/vendor/addons/" } }
  </script>
  <script src="data/data.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
